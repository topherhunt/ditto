<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ditto</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#127a8a" />
    <!-- Before first paint, so a light-theme user never sees a dark flash. Key matches THEME_KEY in theme.ts. -->
    <script>try { if (localStorage.getItem("theme") === "light") document.documentElement.dataset.bsTheme = "light"; } catch {}</script>
  </head>
  <body class="bg-body-tertiary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
